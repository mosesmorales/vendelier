services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vendelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      VENDELIER_MIGRATOR_PASSWORD: ${VENDELIER_MIGRATOR_PASSWORD:-migrator_local}
      VENDELIER_APP_PASSWORD: ${VENDELIER_APP_PASSWORD:-app_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-vendelier-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d vendelier"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
